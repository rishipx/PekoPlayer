name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a file ...
        2. Press ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130 on Windows 11
    validations:
      required: true
  - type: input
    id: media
    attributes:
      label: File type and codec (if playback is involved)
      placeholder: MP4, H.264 + AAC
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Open the browser developer tools, choose the Console tab, and paste any errors.
      render: text
