name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser and media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Static checks
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Generate test fixtures
        run: npm run test:fixtures

      - name: Smoke tests
        run: npm run test:smoke

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    # Firefox and WebKit are checked for startup problems only. They report without blocking merges.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build
        run: npm run build

      - name: Startup checks
        run: npm run test:browsers
        env:
          BROWSER: ${{ matrix.browser }}
