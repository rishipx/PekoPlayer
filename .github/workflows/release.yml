name: Release

# Builds the portable Windows executable. Push a tag such as v1.0.0 to publish it as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Build the portable executable
        run: npm run desktop:dist

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: pekoplayer-windows-portable
          path: |
            release/*.exe
            release/*.sha256
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem release/*.exe, release/*.sha256) --generate-notes --title "PekoPlayer ${{ github.ref_name }}"
